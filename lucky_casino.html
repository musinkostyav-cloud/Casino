<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport"
 content="width=device-width,initial-scale=1">
<title>LUCKY CASINO</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;
 -webkit-tap-highlight-color:transparent}
body{background:radial-gradient(circle at 50% 0,
 #2a1233,#0b0710 70%) fixed;color:#f1e9d8;
 font-family:Georgia,serif;min-height:100vh;
 padding-bottom:30px}
#err{display:none;background:#c0182b;color:#fff;
 padding:10px;font:13px monospace;
 position:sticky;top:0;z-index:99}
header{display:flex;align-items:center;
 justify-content:space-between;flex-wrap:wrap;
 gap:8px;padding:14px;
 border-bottom:1px solid #4a3a1a}
h1{font-size:22px;letter-spacing:3px;
 color:#f5c542;text-shadow:0 0 12px #f5c54277}
.bal{font:bold 18px sans-serif;color:#7dffb0}
button{font-family:inherit;cursor:pointer;
 border:0;transition:.15s}
button:active{transform:scale(.95)}
#reset{background:#2b2236;color:#f1e9d8;
 padding:7px 10px;border-radius:8px;
 font-size:12px}
nav{display:flex;gap:6px;padding:10px;
 overflow-x:auto}
nav button{background:#1c1426;color:#cbbfa8;
 padding:10px 14px;border-radius:20px;
 white-space:nowrap;font-size:14px}
nav button.on{background:#f5c542;color:#1a1200;
 font-weight:bold;box-shadow:0 0 14px #f5c54288}
.game{display:none;max-width:460px;
 margin:0 auto;padding:10px;text-align:center;
 animation:fade .3s}
.game.on{display:block}
@keyframes fade{from{opacity:0;transform:
 translateY(8px)}to{opacity:1}}
.card{background:#171020;border:1px solid #3a2c52;
 border-radius:16px;padding:14px;margin-bottom:12px}
.bet{display:flex;align-items:center;
 justify-content:center;gap:12px;margin:10px 0}
.bet button{width:40px;height:40px;
 border-radius:50%;background:#2b2236;
 color:#f5c542;font-size:22px}
.bet b{min-width:80px;font:bold 20px sans-serif}
.act{width:100%;padding:14px;font-size:18px;
 border-radius:12px;font-weight:bold;
 background:linear-gradient(#ffd75e,#e0a010);
 color:#1a1200}
.act:disabled{opacity:.5}
.msg{min-height:26px;margin-top:8px;
 font:bold 16px sans-serif}
.win{color:#7dffb0}.lose{color:#ff7a85}
.reels{display:flex;justify-content:center;gap:8px}
.reel{width:30%;max-width:110px;aspect-ratio:1;
 background:#0d0813;border:2px solid #f5c542;
 border-radius:14px;font-size:48px;
 display:flex;align-items:center;
 justify-content:center}
.reel.sp{filter:blur(1.5px)}
.grid{display:grid;grid-template-columns:
 repeat(12,1fr);gap:3px;margin:10px 0}
.grid button,.outs button,.sums button{
 border-radius:6px;color:#fff;padding:7px 0;
 font:bold 12px sans-serif;background:#2b2236}
.grid .z{grid-column:span 12;background:#0a7a3a}
.R{background:#b3182b!important}
.B{background:#222!important;
 border:1px solid #555!important}
.sel{outline:3px solid #f5c542;
 box-shadow:0 0 10px #f5c542}
.outs{display:grid;grid-template-columns:
 repeat(3,1fr);gap:6px;margin-bottom:6px}
.big{font:bold 54px sans-serif;margin:6px;
 width:100px;height:100px;border-radius:50%;
 display:inline-flex;align-items:center;
 justify-content:center;border:3px solid #f5c542}
.dice{font-size:80px;letter-spacing:10px}
.shake{animation:sh .15s infinite}
@keyframes sh{0%{transform:rotate(-8deg)}
 50%{transform:rotate(8deg)}
 100%{transform:rotate(-8deg)}}
.sums{display:grid;grid-template-columns:
 repeat(4,1fr);gap:6px;margin:10px 0}
.sums button{padding:8px 0}
canvas{max-width:100%;touch-action:none}
.hist{display:flex;gap:5px;justify-content:center;
 flex-wrap:wrap;margin-top:8px}
.hist span{background:#2b2236;padding:4px 8px;
 border-radius:8px;font:bold 13px sans-serif}

.arw{font-size:11px;color:#f5c542;opacity:.6;letter-spacing:0;
 animation:bl 1.6s infinite}
@keyframes bl{50%{opacity:.15}}
.pop{display:none;position:fixed;top:28%;
 left:50%;z-index:90;pointer-events:none;
 font:bold 34px sans-serif;text-align:center;
 padding:14px 22px;border-radius:18px;
 max-width:92vw;background:#000d}
.pop.w{color:#7dffb0;border:3px solid #7dffb0;
 box-shadow:0 0 30px #7dffb0aa}
.pop.l{color:#ff7a85;border:3px solid #ff7a85;
 font-size:26px}
@keyframes pp{
 0%{opacity:0;transform:translate(-50%,0) scale(.5)}
 15%{opacity:1;transform:translate(-50%,0) scale(1.1)}
 80%{opacity:1;transform:translate(-50%,0) scale(1)}
 100%{opacity:0;transform:translate(-50%,-30px)
  scale(1)}}
.big2{font:bold 48px sans-serif;color:#7dffb0;
 margin:4px}
#cc{background:#0d0813;border-radius:12px;
 border:1px solid #3a2c52}
.coin{width:120px;height:120px;border-radius:50%;
 margin:10px auto;color:#3a2800;
 background:radial-gradient(#ffe38a,#d9a010);
 font:bold 20px sans-serif;display:flex;
 align-items:center;justify-content:center;
 border:4px solid #8a6200;
 box-shadow:0 0 24px #f5c54266}
.coin.flip{animation:cf .6s linear infinite}
@keyframes cf{from{transform:rotateY(0)}
 to{transform:rotateY(360deg)}}
#adm{display:none;position:fixed;inset:0;
 background:#000c;z-index:100;align-items:center;
 justify-content:center;padding:14px}
#adm .box{background:#171020;width:100%;
 max-width:400px;border:2px solid #f5c542;
 border-radius:16px;padding:16px;
 font-family:sans-serif}
#adm h2{color:#f5c542;margin-bottom:10px}
#adm button{background:#2b2236;color:#f1e9d8;
 padding:10px;border-radius:8px;margin:3px;
 font-weight:bold}
#adm .row{display:flex;flex-wrap:wrap;
 justify-content:center;margin:8px 0}
#adm input[type=range]{width:100%}
#adm input[type=number]{width:100%;padding:10px;
 border-radius:8px;border:1px solid #555;
 background:#0d0813;color:#fff;font-size:16px}
#adm .x{background:#c0182b}
</style>
</head>
<body>
<div id="err"></div>
<div id="pop" class="pop"></div>
<header>
 <h1>LUCKY CASINO<small class="arw"> ◀</small></h1>
 <div class="bal">💰 <span id="bal">1000</span></div>
 <button id="reset">Сбросить до 1000</button>
</header>
<nav id="nav"></nav>

<div class="game card" id="g0">
 <div class="reels">
  <div class="reel" id="r0">🍒</div>
  <div class="reel" id="r1">🍋</div>
  <div class="reel" id="r2">🔔</div>
 </div>
 <div class="betbox" data-act="Крутить"
  data-fn="spinSlots"></div>
 <div class="msg" id="m0"></div>
</div>

<div class="game card" id="g1">
 <div class="big" id="rc">0</div>
 <div id="rgrid" class="grid"></div>
 <div class="outs" id="outs"></div>
 <div class="betbox" data-act="Крутить"
  data-fn="spinRoul"></div>
 <div class="msg" id="m1"></div>
</div>

<div class="game card" id="g2">
 <div class="dice" id="dc">⚀⚀</div>
 <div class="sums" id="sums"></div>
 <div class="betbox" data-act="Бросить"
  data-fn="rollDice"></div>
 <div class="msg" id="m2"></div>
</div>

<div class="game card" id="g3">
 <canvas id="wc" width="320" height="340">
 </canvas>
 <div class="betbox" data-act="Крутить"
  data-fn="spinWheel"></div>
 <div class="msg" id="m3"></div>
 <div class="hist" id="h3"></div>
</div>

<div class="game card" id="g4">
 <canvas id="pc" width="340" height="400">
 </canvas>
 <div class="betbox" data-act="Бросить шарик"
  data-fn="dropBall"></div>
 <div class="msg" id="m4"></div>
 <div class="hist" id="h4"></div>
</div>

<div class="game card" id="g5">
 <div class="big2" id="cm">1.00x</div>
 <canvas id="cc" width="320" height="200">
 </canvas>
 <div class="betbox" data-act="Начать"
  data-fn="crashAct"></div>
 <div class="msg" id="m5"></div>
 <div class="hist" id="h5"></div>
</div>

<div class="game card" id="g6">
 <div class="coin" id="coin">ОРЁЛ</div>
 <div class="outs" id="cs"
  style="grid-template-columns:repeat(2,1fr)">
 </div>
 <div class="bet"><b>Ставка: ВСЁ</b></div>
 <button class="act" id="coinbtn">
  Всё или ничего</button>
 <div class="msg" id="m6"></div>
</div>

<div id="adm"><div class="box">
 <h2>🔧 Админ-меню</h2>
 <div>Удача: <b id="lv">0</b>% шанс
  принудительного выигрыша</div>
 <input type="range" id="lk" min="0" max="100"
  value="0">
 <div class="row" id="addrow"></div>
 <input type="number" id="amt"
  placeholder="Своя сумма">
 <div class="row">
  <button id="addc">Выдать сумму</button>
  <button id="setc">Установить баланс</button>
 </div>
 <button class="x" id="adx" style="width:100%">
  Закрыть</button>
</div></div>

<script>
window.onerror = function(msg, src, line) {
  var e = document.getElementById('err');
  e.style.display = 'block';
  e.textContent = 'Ошибка: ' + msg +
    ' (строка ' + line + ')';
};

function $(id) { return document.getElementById(id); }
var STEPS = [10, 20, 50, 100, 200, 500, 1000,
  2000, 5000, 10000, 20000, 50000, 100000,
  200000, 500000, 1000000];
var bal = 1000, bi = 0;
var busy = {};

function render() {
  $('bal').textContent = Math.round(bal * 100) / 100;
  var bs = document.querySelectorAll('.bv');
  for (var i = 0; i < bs.length; i++) {
    bs[i].textContent = STEPS[bi];
  }
}
function msg(n, t, win) {
  var m = $('m' + n);
  m.textContent = t;
  m.className = 'msg ' + (win ? 'win' : 'lose');
  if (t) popup(t, win);
}
function popup(t, win) {
  var p = $('pop');
  p.textContent = t;
  p.className = 'pop ' + (win ? 'w' : 'l');
  p.style.display = 'block';
  p.style.animation = 'none';
  void p.offsetWidth;
  p.style.animation = 'pp 2s forwards';
}
function pay(n) {
  if (bal < STEPS[bi]) {
    msg(n, 'Недостаточно фишек', false);
    return false;
  }
  bal -= STEPS[bi];
  render();
  return true;
}
function rnd(n) { return Math.floor(Math.random() * n); }
function hist(id, arr, v, good) {
  arr.unshift([v, good]);
  if (arr.length > 8) arr.pop();
  var h = $(id), s = '';
  for (var i = 0; i < arr.length; i++) {
    s += '<span style="color:' +
      (arr[i][1] ? '#7dffb0' : '#ff7a85') +
      '">' + arr[i][0] + '</span>';
  }
  h.innerHTML = s;
}

// ---------- навигация и ставки ----------
var NAMES = ['🎰 Слоты', '🎡 Рулетка', '🎲 Кости',
  '🎯 Колесо', '📍 Плинко', '📈 Крэш',
  '🪙 Монетка'];
NAMES.forEach(function(nm, i) {
  var b = document.createElement('button');
  b.textContent = nm;
  b.onclick = function() { show(i); };
  $('nav').appendChild(b);
});
function show(i) {
  var bs = $('nav').children;
  for (var k = 0; k < NAMES.length; k++) {
    bs[k].className = k == i ? 'on' : '';
    $('g' + k).className =
      'game card' + (k == i ? ' on' : '');
  }
}
document.querySelectorAll('.betbox')
.forEach(function(box) {
  box.innerHTML =
    '<div class="bet"><button class="mn">−' +
    '</button><b>🪙 <span class="bv"></span></b>' +
    '<button class="pl">+</button></div>' +
    '<button class="act">' +
    box.dataset.act + '</button>';
  box.querySelector('.mn').onclick = function() {
    if (bi > 0) bi--; render();
  };
  box.querySelector('.pl').onclick = function() {
    if (bi < STEPS.length - 1) bi++; render();
  };
  box.querySelector('.act').onclick = function() {
    window[box.dataset.fn]();
  };
});
$('reset').onclick = function() {
  bal = 1000; render();
};

// ---------- 1. слоты ----------
var SYM = ['🍒', '🍋', '🔔', '⭐', '💎', '7️⃣'];
var SPAY = {'7️⃣': 100, '💎': 40, '⭐': 20,
  '🔔': 10, '🍋': 5, '🍒': 3};
function spinSlots() {
  if (busy.s || !pay(0)) return;
  busy.s = true;
  msg(0, '', true);
  var res = [], timers = [], stopped = 0;
  var forced = rig() ? SYM[rnd(6)] : null;
  var bet = STEPS[bi];
  [0, 1, 2].forEach(function(i) {
    var el = $('r' + i);
    el.classList.add('sp');
    timers[i] = setInterval(function() {
      el.textContent = SYM[rnd(6)];
    }, 70);
    setTimeout(function() {
      clearInterval(timers[i]);
      res[i] = forced || SYM[rnd(6)];
      el.textContent = res[i];
      el.classList.remove('sp');
      if (++stopped == 3) finish();
    }, 900 + i * 600);
  });
  function finish() {
    var mult = 0, a = res[0], b = res[1], c = res[2];
    if (a == b && b == c) mult = SPAY[a];
    else if (a == b || b == c || a == c) {
      var p = a == b ? a : (b == c ? b : a);
      mult = (p == '7️⃣' || p == '💎' ||
        p == '⭐') ? 2 : 1;
    }
    bal += bet * mult; render();
    if (mult > 0) msg(0, 'Выигрыш х' + mult +
      ': +' + bet * mult, true);
    else msg(0, 'Проигрыш -' + bet, false);
    busy.s = false;
  }
}

// ---------- 2. рулетка ----------
var REDS = [1,3,5,7,9,12,14,16,18,19,21,23,
  25,27,30,32,34,36];
var rbet = {t: 'red'};
var OUTS = [['red', 'Красное'], ['black', 'Чёрное'],
  ['even', 'Чёт'], ['odd', 'Нечёт'],
  ['low', '1-18'], ['high', '19-36']];
function clr(n) {
  return n == 0 ? 'G' : (REDS.indexOf(n) >= 0
    ? 'R' : 'B');
}
function markSel() {
  var all = document.querySelectorAll(
    '#g1 .grid button,#g1 .outs button');
  all.forEach(function(b) {
    var on = b.dataset.t == rbet.t &&
      (rbet.t != 'num' || b.dataset.v == rbet.v);
    b.classList.toggle('sel', on);
  });
}
function mkBtn(parent, txt, t, v, cls) {
  var b = document.createElement('button');
  b.textContent = txt;
  b.dataset.t = t;
  if (v !== undefined) b.dataset.v = v;
  if (cls) b.className = cls;
  b.onclick = function() {
    rbet = {t: t, v: v}; markSel();
  };
  parent.appendChild(b);
}
mkBtn($('rgrid'), '0 (х36)', 'num', 0, 'z');
for (var n = 1; n <= 36; n++) {
  mkBtn($('rgrid'), n, 'num', n, clr(n));
}
OUTS.forEach(function(o) {
  mkBtn($('outs'), o[1] + ' х2', o[0]);
});
markSel();
function rwins(n) {
  var k = rbet.t;
  if (k == 'num') return n == rbet.v;
  if (n == 0) return false;
  if (k == 'red') return clr(n) == 'R';
  if (k == 'black') return clr(n) == 'B';
  if (k == 'even') return n % 2 == 0;
  if (k == 'odd') return n % 2 == 1;
  if (k == 'low') return n <= 18;
  return n >= 19;
}
function spinRoul() {
  if (busy.r || !pay(1)) return;
  busy.r = true;
  msg(1, '', true);
  var bet = STEPS[bi], el = $('rc');
  var t = setInterval(function() {
    el.textContent = rnd(37);
  }, 60);
  setTimeout(function() {
    clearInterval(t);
    var n = rnd(37);
    if (rig()) {
      for (var q = 0; q < 300; q++) {
        if (rwins(n)) break;
        n = rnd(37);
      }
    }
    el.textContent = n;
    el.style.color = n == 0 ? '#3f3' :
      (clr(n) == 'R' ? '#f55' : '#fff');
    var k = rbet.t, w = false, m = 2;
    if (k == 'num') { w = n == rbet.v; m = 36; }
    else if (n > 0) {
      if (k == 'red') w = clr(n) == 'R';
      if (k == 'black') w = clr(n) == 'B';
      if (k == 'even') w = n % 2 == 0;
      if (k == 'odd') w = n % 2 == 1;
      if (k == 'low') w = n <= 18;
      if (k == 'high') w = n >= 19;
    }
    if (w) {
      bal += bet * m; render();
      msg(1, 'ВЫИГРЫШ +' + bet * m +
        ' (выпало ' + n + ')', true);
    } else msg(1, 'Проигрыш -' + bet +
      ' (выпало ' + n + ')', false);
    busy.r = false;
  }, 2200);
}

// ---------- 3. кости ----------
var FACES = ['⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];
var DM = {2:32, 3:16, 4:11, 5:8, 6:6, 7:5,
  8:6, 9:8, 10:11, 11:16, 12:32};
var dsum = 7;
for (var s = 2; s <= 12; s++) {
  (function(s) {
    var b = document.createElement('button');
    b.innerHTML = s + '<br>х' + DM[s];
    b.dataset.s = s;
    b.onclick = function() {
      dsum = s; markDice();
    };
    $('sums').appendChild(b);
  })(s);
}
function markDice() {
  document.querySelectorAll('#sums button')
  .forEach(function(b) {
    b.classList.toggle('sel', b.dataset.s == dsum);
  });
}
markDice();
function rollDice() {
  if (busy.d || !pay(2)) return;
  busy.d = true;
  msg(2, '', true);
  var bet = STEPS[bi], el = $('dc');
  el.classList.add('shake');
  var t = setInterval(function() {
    el.textContent = FACES[rnd(6)] + FACES[rnd(6)];
  }, 90);
  setTimeout(function() {
    clearInterval(t);
    el.classList.remove('shake');
    var a = rnd(6), b = rnd(6);
    if (rig()) {
      do { a = rnd(6); b = dsum - 2 - a; }
      while (b < 0 || b > 5);
    }
    var sum = a + b + 2;
    el.textContent = FACES[a] + FACES[b];
    if (sum == dsum) {
      var w = bet * DM[sum];
      bal += w; render();
      msg(2, 'ВЫИГРЫШ +' + w +
        ' (сумма ' + sum + ')', true);
    } else msg(2, 'Проигрыш -' + bet +
      ' (сумма ' + sum + ')', false);
    busy.d = false;
  }, 1600);
}

// ---------- 4. колесо фортуны ----------
var WM = [8, 0, 1, 0.5, 2, -2, 1.5, 0,
  3, 1, 0.5, 0, 2, -2, 1, 1.5];
var wh = [], wrot = 0, wball = 0;
var wcv = $('wc'), wx = wcv.getContext('2d');
function drawWheel(ballR) {
  var cx = 160, cy = 185, R = 140;
  var a = Math.PI * 2 / 16;
  wx.clearRect(0, 0, 320, 340);
  for (var i = 0; i < 16; i++) {
    var st = -Math.PI / 2 + wrot + i * a;
    var m = WM[i];
    wx.beginPath();
    wx.moveTo(cx, cy);
    wx.arc(cx, cy, R, st, st + a);
    wx.fillStyle = m < 0 ? '#6b1ea8' : (m == 0 ?
      '#333' : (i % 2 ? '#b3182b' : '#1b6b3a'));
    wx.fill();
    wx.strokeStyle = '#f5c542';
    wx.lineWidth = 2;
    wx.stroke();
    wx.save();
    wx.translate(cx, cy);
    wx.rotate(st + a / 2);
    wx.fillStyle = '#fff';
    wx.font = 'bold 16px sans-serif';
    wx.textAlign = 'right';
    wx.fillText('x' + m, R - 10, 5);
    wx.restore();
  }
  wx.beginPath();
  wx.arc(cx, cy, 18, 0, 7);
  wx.fillStyle = '#f5c542';
  wx.fill();
  wx.beginPath();
  wx.moveTo(cx - 12, 8);
  wx.lineTo(cx + 12, 8);
  wx.lineTo(cx, 34);
  wx.fillStyle = '#f5c542';
  wx.fill();
  wx.beginPath();
  wx.arc(cx, cy - ballR, 8, 0, 7);
  wx.fillStyle = '#fff';
  wx.shadowColor = '#fff';
  wx.shadowBlur = 10;
  wx.fill();
  wx.shadowBlur = 0;
}
drawWheel(R0());
function R0() { return 140 * 0.82; }
function spinWheel() {
  if (busy.w || !pay(3)) return;
  busy.w = true;
  msg(3, '', true);
  var bet = STEPS[bi], a = Math.PI * 2 / 16;
  var k = rnd(16), TAU = Math.PI * 2;
  if (rig()) {
    while (WM[k] <= 1) k = rnd(16);
  }
  var cur = ((wrot % TAU) + TAU) % TAU;
  var need = (((-(k + 0.5) * a - cur) % TAU)
    + TAU) % TAU;
  var delta = TAU * 5 + need;
  var start = wrot, t0 = performance.now();
  var DUR = 4500;
  function step(now) {
    var p = Math.min(1, (now - t0) / DUR);
    var e = 1 - Math.pow(1 - p, 3);
    wrot = start + delta * e;
    var hop = Math.abs(Math.sin(p * 40)) *
      28 * (1 - p);
    var fall = p > 0.8 ? (p - 0.8) / 0.2 : 0;
    var r = 140 + 14 + hop - fall * (140 * 0.18 + 14);
    drawWheel(Math.max(r, R0()));
    if (p < 1) requestAnimationFrame(step);
    else endWheel();
  }
  requestAnimationFrame(step);
  function endWheel() {
    var m = WM[k], d = 0;
    if (m > 0) d = bet * m;
    if (m < 0) d = -bet;
    bal = Math.max(0, bal + d); render();
    if (m > 0) msg(3, (m >= 1 ? 'ВЫИГРЫШ' : 'Возврат')
      + ' х' + m + ': +' + d, m >= 1);
    else if (m < 0) msg(3, 'Минус х2! -' +
      bet * 2, false);
    else msg(3, 'Проигрыш -' + bet, false);
    hist('h3', wh, 'x' + m, m > 1);
    busy.w = false;
  }
}

// ---------- 5. плинко ----------
var PM = [18, 5, 2, 1, 0.5, 1, 2, 5, 18];
var PW = 340, PH = 400, SP = 30, ROWS = 8;
var pcv = $('pc'), px = pcv.getContext('2d');
var pegs = [], balls = [], ph = [], loop = false;
for (var r = 0; r < ROWS; r++) {
  var cnt = r + 3;
  for (var j = 0; j < cnt; j++) {
    pegs.push({
      x: PW / 2 + (j - (cnt - 1) / 2) * SP,
      y: 50 + r * 38
    });
  }
}
function drawPlinko() {
  px.clearRect(0, 0, PW, PH);
  var sw = PW / PM.length;
  for (var i = 0; i < PM.length; i++) {
    var hot = PM[i] >= 5, mid = PM[i] >= 1;
    px.fillStyle = hot ? '#c0182b' : (mid ?
      '#d98c10' : '#1b6b3a');
    px.fillRect(i * sw + 2, PH - 34, sw - 4, 32);
    px.fillStyle = '#fff';
    px.font = 'bold 12px sans-serif';
    px.textAlign = 'center';
    px.fillText('x' + PM[i], i * sw + sw / 2,
      PH - 14);
  }
  px.fillStyle = '#fff';
  pegs.forEach(function(p) {
    px.beginPath();
    px.arc(p.x, p.y, 3.5, 0, 7);
    px.fill();
  });
  balls.forEach(function(b) {
    px.beginPath();
    px.arc(b.x, b.y, 7, 0, 7);
    px.fillStyle = '#ff2a3a';
    px.shadowColor = '#ff2a3a';
    px.shadowBlur = 10;
    px.fill();
    px.shadowBlur = 0;
  });
}
function dropBall() {
  if (!pay(4)) return;
  balls.push({x: PW / 2 + (Math.random() - 0.5) * 6,
    y: 10, vx: (Math.random() - 0.5) * 0.6,
    vy: 0, bet: STEPS[bi], tx: rigTarget()});
  if (!loop) { loop = true; tick(); }
}
function tick() {
  for (var n = balls.length - 1; n >= 0; n--) {
    var b = balls[n];
    for (var s = 0; s < 2; s++) {
      b.vy += 0.12;
      if (b.tx) {
        b.vx += (b.tx - b.x) * 0.0035;
        b.vx *= 0.995;
      }
      b.x += b.vx; b.y += b.vy;
      if (b.x < 8) { b.x = 8; b.vx = Math.abs(b.vx); }
      if (b.x > PW - 8) {
        b.x = PW - 8; b.vx = -Math.abs(b.vx);
      }
      for (var i = 0; i < pegs.length; i++) {
        var p = pegs[i];
        var dx = b.x - p.x, dy = b.y - p.y;
        var d = Math.sqrt(dx * dx + dy * dy);
        if (d < 10.5 && d > 0) {
          var nx = dx / d, ny = dy / d;
          var dot = b.vx * nx + b.vy * ny;
          if (dot < 0) {
            b.vx -= 1.5 * dot * nx;
            b.vy -= 1.5 * dot * ny;
            b.vx += (Math.random() - 0.5) * 0.8;
          }
          b.x = p.x + nx * 10.5;
          b.y = p.y + ny * 10.5;
        }
      }
    }
    if (b.y > PH - 40) {
      var idx = Math.min(PM.length - 1,
        Math.max(0, Math.floor(b.x / (PW / PM.length))));
      var m = PM[idx], w = b.bet * m;
      bal += w; render();
      msg(4, (m >= 1 ? 'ВЫИГРЫШ' : 'Возврат') +
        ' х' + m + ': +' + w, m >= 1);
      hist('h4', ph, 'x' + m, m >= 1);
      balls.splice(n, 1);
    }
  }
  drawPlinko();
  if (balls.length) requestAnimationFrame(tick);
  else loop = false;
}
drawPlinko();

// ---------- 6. крэш ----------
var ch = [], cr = null;
var cx5 = $('cc').getContext('2d');
function crashBtn(txt, dis) {
  var b = document.querySelector('#g5 .act');
  b.textContent = txt;
  b.disabled = dis;
}
function crashAct() {
  if (cr && cr.on) return cashOut();
  if (cr && cr.run) return;
  if (!pay(5)) return;
  var at = 0.97 / (1 - Math.random());
  if (rig()) at = Math.max(at, 2 + Math.random() * 8);
  at = Math.min(1000, Math.max(1, at));
  cr = {bet: STEPS[bi], at: at, m: 1,
    t0: performance.now(), on: true, run: true};
  msg(5, '', true);
  crashBtn('Забрать', false);
  requestAnimationFrame(crashStep);
}
function crashStep(now) {
  if (!cr.run) return;
  var t = Math.max(0, (now - cr.t0) / 1000);
  cr.m = Math.exp(0.15 * t);
  if (cr.m >= cr.at) {
    cr.m = cr.at;
    t = Math.log(cr.at) / 0.15;
    drawCrash(t, true);
    endCrash();
    return;
  }
  drawCrash(t, false);
  requestAnimationFrame(crashStep);
}
function drawCrash(t, dead) {
  var m = cr.m, mv = Math.max(m, 1.5);
  var tv = Math.max(t, 1);
  cx5.clearRect(0, 0, 320, 200);
  cx5.strokeStyle = dead ? '#ff4a5a' : '#7dffb0';
  cx5.lineWidth = 3;
  cx5.beginPath();
  for (var i = 0; i <= 60; i++) {
    var tt = t * i / 60;
    var mm = Math.exp(0.15 * tt);
    var x = 10 + tt / tv * 300;
    var y = 190 - (mm - 1) / (mv - 1) * 170;
    if (i == 0) cx5.moveTo(x, y);
    else cx5.lineTo(x, y);
  }
  cx5.stroke();
  var el = $('cm');
  el.textContent = m.toFixed(2) + 'x';
  el.style.color = dead ? '#ff7a85' : '#7dffb0';
}
function cashOut() {
  if (!cr.on) return;
  cr.on = false;
  var w = Math.floor(cr.bet * cr.m * 100) / 100;
  bal += w; render();
  msg(5, 'ВЫИГРЫШ +' + w +
    ' (х' + cr.m.toFixed(2) + ')', true);
  crashBtn('Ждём краш...', true);
}
function endCrash() {
  cr.run = false;
  if (cr.on) {
    cr.on = false;
    msg(5, 'КРАШ х' + cr.at.toFixed(2) +
      '! -' + cr.bet, false);
  }
  hist('h5', ch, 'x' + cr.at.toFixed(2),
    cr.at >= 2);
  crashBtn('Начать', false);
}

// ---------- 7. монетка (всё или ничего) ----------
var cside = 0;
['🦅 Орёл', '🪙 Решка'].forEach(function(t, i) {
  var b = document.createElement('button');
  b.textContent = t;
  b.onclick = function() { cside = i; markSide(); };
  $('cs').appendChild(b);
});
function markSide() {
  var bs = $('cs').children;
  for (var i = 0; i < 2; i++) {
    bs[i].classList.toggle('sel', i == cside);
  }
}
markSide();
function flipCoin() {
  if (busy.c) return;
  if (bal <= 0) { msg(6, 'Нет фишек', false); return; }
  busy.c = true;
  msg(6, '', true);
  var all = bal;
  bal = 0; render();
  var el = $('coin');
  el.classList.add('flip');
  var t = setInterval(function() {
    el.textContent = rnd(2) ? 'РЕШКА' : 'ОРЁЛ';
  }, 100);
  setTimeout(function() {
    clearInterval(t);
    el.classList.remove('flip');
    var res = rnd(2);
    if (rig()) res = cside;
    el.textContent = res ? 'РЕШКА' : 'ОРЁЛ';
    if (res == cside) {
      bal += all * 2; render();
      msg(6, 'ВЫИГРЫШ +' + all +
        '! Баланс удвоен', true);
    } else {
      msg(6, 'Проигрыш -' + all +
        '. Всё потеряно', false);
    }
    busy.c = false;
  }, 2000);
}
$('coinbtn').onclick = flipCoin;

// ---------- админ-меню ----------
var luck = 0;
function rig() {
  return Math.random() * 100 < luck;
}
function rigTarget() {
  if (!rig()) return null;
  var ok = [0, 1, 2, 6, 7, 8];
  return (ok[rnd(6)] + 0.5) * PW / PM.length;
}
var taps = 0, tt = 0;
document.querySelector('h1').onclick = function() {
  var now = Date.now();
  taps = (now - tt < 1500) ? taps + 1 : 1;
  tt = now;
  if (taps >= 5) {
    taps = 0;
    $('adm').style.display = 'flex';
  }
};
$('adx').onclick = function() {
  $('adm').style.display = 'none';
};
$('lk').oninput = function() {
  luck = +this.value;
  $('lv').textContent = luck;
};
[1000, 10000, 100000, 1000000]
.forEach(function(v) {
  var b = document.createElement('button');
  b.textContent = '+' + v;
  b.onclick = function() { bal += v; render(); };
  $('addrow').appendChild(b);
});
$('addc').onclick = function() {
  var v = parseFloat($('amt').value);
  if (v > 0) { bal += v; render(); }
};
$('setc').onclick = function() {
  var v = parseFloat($('amt').value);
  if (v >= 0) { bal = v; render(); }
};

show(0);
render();
</script>
